# Core-1 (VyOS rolling) - configuration as exported by the dashboard backup.
# Secrets removed: password hashes and SNMPv3 keys are shown as <REMOVED>.
# Core-2 is identical except: host-name Core-2, eth0 10.0.0.3/29, VLAN addresses .3,
# eth3 10.0.1.2/30, loopback/router-id 10.255.0.2, VRRP priority 100, SNMP engine-id ...002.
# The default 'vyos' login was deleted on both cores; only 'netadmin' remains.

set firewall group network-group MGMT-NETS network '10.10.99.0/24'
set firewall group network-group MGMT-NETS network '172.16.100.0/24'
set firewall ipv4 forward filter default-action 'accept'
set firewall ipv4 forward filter rule 5 action 'accept'
set firewall ipv4 forward filter rule 5 state 'established'
set firewall ipv4 forward filter rule 5 state 'related'
set firewall ipv4 forward filter rule 10 action 'drop'
set firewall ipv4 forward filter rule 10 description 'Block Student to Admin'
set firewall ipv4 forward filter rule 10 destination address '10.10.10.0/24'
set firewall ipv4 forward filter rule 10 source address '10.10.20.0/24'
set firewall ipv4 forward filter rule 20 action 'drop'
set firewall ipv4 forward filter rule 20 description 'Block Student to Mgmt'
set firewall ipv4 forward filter rule 20 destination address '10.10.99.0/24'
set firewall ipv4 forward filter rule 20 source address '10.10.20.0/24'
set firewall ipv4 input filter default-action 'accept'
set firewall ipv4 input filter rule 10 action 'accept'
set firewall ipv4 input filter rule 10 state 'established'
set firewall ipv4 input filter rule 10 state 'related'
set firewall ipv4 input filter rule 20 action 'accept'
set firewall ipv4 input filter rule 20 destination port '22'
set firewall ipv4 input filter rule 20 protocol 'tcp'
set firewall ipv4 input filter rule 20 source group network-group 'MGMT-NETS'
set firewall ipv4 input filter rule 21 action 'drop'
set firewall ipv4 input filter rule 21 destination port '22'
set firewall ipv4 input filter rule 21 protocol 'tcp'
set firewall ipv4 input filter rule 30 action 'accept'
set firewall ipv4 input filter rule 30 destination port '161'
set firewall ipv4 input filter rule 30 protocol 'udp'
set firewall ipv4 input filter rule 30 source group network-group 'MGMT-NETS'
set firewall ipv4 input filter rule 31 action 'drop'
set firewall ipv4 input filter rule 31 destination port '161'
set firewall ipv4 input filter rule 31 protocol 'udp'
set high-availability vrrp group TRANSIT address 10.0.0.4/29
set high-availability vrrp group TRANSIT interface 'eth0'
set high-availability vrrp group TRANSIT priority '200'
set high-availability vrrp group TRANSIT rfc3768-compatibility
set high-availability vrrp group TRANSIT vrid '100'
set high-availability vrrp group VLAN10 address 10.10.10.1/24
set high-availability vrrp group VLAN10 interface 'eth1.10'
set high-availability vrrp group VLAN10 priority '200'
set high-availability vrrp group VLAN10 rfc3768-compatibility
set high-availability vrrp group VLAN10 vrid '10'
set high-availability vrrp group VLAN20 address 10.10.20.1/24
set high-availability vrrp group VLAN20 interface 'eth1.20'
set high-availability vrrp group VLAN20 priority '200'
set high-availability vrrp group VLAN20 rfc3768-compatibility
set high-availability vrrp group VLAN20 vrid '20'
set high-availability vrrp group VLAN30 address 10.10.30.1/24
set high-availability vrrp group VLAN30 interface 'eth2.30'
set high-availability vrrp group VLAN30 priority '200'
set high-availability vrrp group VLAN30 rfc3768-compatibility
set high-availability vrrp group VLAN30 vrid '30'
set high-availability vrrp group VLAN99 address 10.10.99.1/24
set high-availability vrrp group VLAN99 interface 'eth2.99'
set high-availability vrrp group VLAN99 priority '200'
set high-availability vrrp group VLAN99 rfc3768-compatibility
set high-availability vrrp group VLAN99 vrid '99'
set interfaces ethernet eth0 address '10.0.0.2/29'
set interfaces ethernet eth0 description 'Transit to pfSense'
set interfaces ethernet eth0 offload gro
set interfaces ethernet eth1 description 'Trunk to SW-1'
set interfaces ethernet eth1 offload gro
set interfaces ethernet eth1 vif 10 address '10.10.10.2/24'
set interfaces ethernet eth1 vif 10 description 'VLAN10-Admin'
set interfaces ethernet eth1 vif 20 address '10.10.20.2/24'
set interfaces ethernet eth1 vif 20 description 'VLAN20-Student'
set interfaces ethernet eth2 description 'Trunk to SW-2'
set interfaces ethernet eth2 offload gro
set interfaces ethernet eth2 vif 30 address '10.10.30.2/24'
set interfaces ethernet eth2 vif 30 description 'VLAN30-Server'
set interfaces ethernet eth2 vif 99 address '10.10.99.2/24'
set interfaces ethernet eth2 vif 99 description 'VLAN99-Mgmt'
set interfaces ethernet eth3 address '10.0.1.1/30'
set interfaces ethernet eth3 description 'Link to Core-2'
set interfaces ethernet eth3 offload gro
set interfaces loopback lo address '10.255.0.1/32'
set protocols ospf area 0 network '10.0.1.0/30'
set protocols ospf area 0 network '10.255.0.1/32'
set protocols ospf area 0 network '10.10.10.0/24'
set protocols ospf area 0 network '10.10.20.0/24'
set protocols ospf area 0 network '10.10.30.0/24'
set protocols ospf area 0 network '10.10.99.0/24'
set protocols ospf interface eth1.10 passive
set protocols ospf interface eth1.20 passive
set protocols ospf interface eth2.30 passive
set protocols ospf interface eth2.99 passive
set protocols ospf parameters router-id '10.255.0.1'
set protocols static route 0.0.0.0/0 next-hop 10.0.0.1
set service ntp allow-client address '127.0.0.0/8'
set service ntp allow-client address '169.254.0.0/16'
set service ntp allow-client address '10.0.0.0/8'
set service ntp allow-client address '172.16.0.0/12'
set service ntp allow-client address '192.168.0.0/16'
set service ntp allow-client address '::1/128'
set service ntp allow-client address 'fe80::/10'
set service ntp allow-client address 'fc00::/7'
set service ntp server time1.vyos.net
set service ntp server time2.vyos.net
set service ntp server time3.vyos.net
set service snmp v3 engineid '000000000000000000000001'
set service snmp v3 group ZBX mode 'ro'
set service snmp v3 group ZBX view 'ALL'
set service snmp v3 user zabbix auth encrypted-password '<REMOVED>'
set service snmp v3 user zabbix auth type 'sha'
set service snmp v3 user zabbix group 'ZBX'
set service snmp v3 user zabbix privacy encrypted-password '<REMOVED>'
set service snmp v3 user zabbix privacy type 'aes'
set service snmp v3 view ALL oid 1
set service ssh port '22'
set system config-management commit-revisions '100'
set system console device ttyS0 kernel
set system console device ttyS0 speed '115200'
set system host-name 'Core-1'
set system login banner pre-login 'Authorised access only. All activity is monitored.'
set system login operator-group default command-policy allow '*'
set system login user netadmin authentication encrypted-password '<REMOVED>'
set system option reboot-on-upgrade-failure '5'
set system syslog local facility all level 'info'
set system syslog local facility local7 level 'debug'
